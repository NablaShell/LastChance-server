services:
  caddy:
    image: caddy:alpine
    container_name: revers-proxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - sms-relay
      - file-relay
    environment:
      DOMAIN: ${DOMAIN}
      STEALTH_HEADER_NAME: ${STEALTH_HEADER_NAME}
      STEALTH_HEADER_VALUE: ${STEALTH_HEADER_VALUE}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

  sms-relay:
    build: ./node
    container_name: sms-relay
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      STEALTH_HEADER_NAME: ${STEALTH_HEADER_NAME}
      STEALTH_HEADER_VALUE: ${STEALTH_HEADER_VALUE}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
    expose:
      - "8080"
    networks:
      - internal

  file-relay:
    build: ./file_api
    container_name: file-relay
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      STEALTH_HEADER_NAME: ${STEALTH_HEADER_NAME}
      STEALTH_HEADER_VALUE: ${STEALTH_HEADER_VALUE}
    volumes:
      - ./data/vault:/var/lib/lastchance/vault
    expose:
      - "8081"
    networks:
      - internal

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
